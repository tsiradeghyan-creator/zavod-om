name: zavod-reel
version: "1.0"
description: >
  General short-form vertical reel (9:16) in the zavod's voice. The checkpoint spine is
  idea → script → scene_plan → assets → edit → compose → publish, but the production
  work inside those stages follows owner-approved specialist sub-stages. Brain = skills/zavod-craft (wired
  per stage via skills/zavod-craft/INDEX.md). Hard gates: Armenian glyph gate on all
  text payloads, object-permanence continuity on every generated clip, variation
  (anti-generic), human checkpoints. Delivery-promise is reviewer-invoked until it
  enters the checkpoint seam.
category: generated
stability: beta
default_checkpoint_policy: guided

orchestration:
  mode: executive-producer
  skill: pipelines/zavod/executive-producer
  budget_default_usd: 2.00
  max_revisions_per_stage: 3
  max_send_backs: 3
  max_wall_time_minutes: 30

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: true

metadata:
  production_engine:
    ask_at_start: true              # EP asks Remotion vs Higgsfield before any production
    locked_in: engine_lock          # carried in artifacts.engine_lock.engine, enforced at the seam
    no_cross_lane: true             # the two lanes never mix
    lanes:
      remotion:                     # programmatic build — motion graphics, kinetic type, overlays
        generation: none            # NO AI footage
        compose_runtime: [remotion, hyperframes]
        forbids: [higgsfield]
      higgsfield:                   # AI footage — real-photo image-to-video, generative clips
        generation: higgsfield
        compose_runtime: [ffmpeg]   # zero Remotion — ffmpeg overlay/assembly
        forbids: [remotion, hyperframes]
  production_sequence:
    owner_approval_after_each_sub_stage: true
    no_collapse: true
    map:
      - idea_development
      - script_development
      - creative_language
      - technical_preparation
      - preproduction
      - shoot_or_render
      - postproduction
      - finishing
      - presentation
    if_idea_missing: start_with_writer_room_brainstorm
    if_script_exists: treat_script_as_locked_input_and_start_from_next_open_phase

required_skills:
  - pipelines/zavod/executive-producer
  - pipelines/zavod/idea-director
  - pipelines/zavod/script-director
  - pipelines/zavod/scene-director
  - pipelines/zavod/asset-director
  - pipelines/zavod/edit-director
  - pipelines/zavod/compose-director
  - pipelines/zavod/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol

compatible_playbooks:
  recommended: []
  also_works: []
  custom_allowed: true

stages:
  - name: idea
    skill: pipelines/zavod/idea-director
    produces: [brief]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - One segment + one hook is explicit (idea-lab.md gates)
      - Format/duration/platform realistic for 9:16
    sub_stages:
      - name: intake_or_writer_room
        produces: [idea_options]
        description: If no idea exists, the writers' room brainstorms 3-5 concepts; if an idea exists, it clarifies the logline, genre, protagonist, conflict, and desired aftertaste.
        human_approval_default: true
        review_focus:
          - Owner chooses one idea before any script work
          - Audience, emotion, genre, protagonist, conflict, and hook are explicit
      - name: concept_lock
        produces: [concept_brief]
        description: Lock the chosen concept into a brief with audience, format, platform, duration, success metric, and open risks.
        human_approval_default: true
        review_focus:
          - One concept only
          - No script drafting before owner approval
    success_criteria:
      - Schema-valid brief
  - name: script
    skill: pipelines/zavod/script-director
    required_artifacts_in: [brief]
    produces: [script]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Voice matches style-profile.md / brand-voice.md
      - "GATE: Armenian text passes the glyph gate (lib/armenian_glyph_gate.py)"
    sub_stages:
      - name: expanded_story_structure
        produces: [story_structure]
        description: "Build the full story structure before scenes: beginning, development, ending, turns, stakes, and emotional arc."
        human_approval_default: true
        review_focus:
          - Structure is approved before scene drafting
      - name: scene_outline
        produces: [scene_outline]
        description: Turn the structure into ordered scenes with location, objective, obstacle, and scene turn.
        human_approval_default: true
        review_focus:
          - Every scene has a job
      - name: dialogue_pass
        produces: [dialogue]
        description: Write and polish dialogue in the locked voice/register.
        human_approval_default: true
        review_focus:
          - Dialogue sounds spoken, not literary
      - name: motivation_pass
        produces: [motivation_map]
        description: Lock character motives, subtext, and cause-effect continuity.
        human_approval_default: true
        review_focus:
          - Character actions are motivated
      - name: shooting_script_lock
        produces: [shooting_script]
        description: Produce the shoot/render-ready script and freeze it before creative-language work.
        human_approval_default: true
        review_focus:
          - Owner approves the script lock
    success_criteria:
      - Schema-valid script
  - name: scene_plan
    skill: pipelines/zavod/scene-director
    required_artifacts_in: [script]
    produces: [scene_plan]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Every scene has shot_language + staging (cinematography.md / art-department.md)
      - in_hand_objects declared for any held prop (feeds continuity gate)
      - text_policy set (overlay default; glyph gate runs on all text payloads)
      - Shot variety passes variation_checker (no slideshow)
    sub_stages:
      - name: creative_language_council
        produces: [creative_language]
        description: Director, cinematographer, production designer, sound lead, editor, composer, and colorist decide how the film looks, sounds, moves, and feels.
        human_approval_default: true
        review_focus:
          - Visual language, sound language, edit rhythm, music direction, art direction, and color approach are proposed as choices
          - Owner locks one direction before technical prep
      - name: technical_preparation
        produces: [technical_plan]
        description: Choose camera/format, lens style, lighting approach, sound recording plan, picture format, and media-storage workflow.
        human_approval_default: true
        review_focus:
          - Camera, optics, lighting, sound, format, and storage are explicit
      - name: storyboard_shot_cards
        produces: [shot_cards]
        description: Build the storyboard / shot cards with camera, lens, aperture, movement, lighting recipe, grade, action, audio bed, duration, and overlay policy.
        human_approval_default: true
        review_focus:
          - Every shot has the full technical card
      - name: preproduction_plan
        produces: [preproduction_plan]
        description: Lock casting policy, locations, visual references, shooting/render plan, costume, decor, props, and technical tests.
        human_approval_default: true
        review_focus:
          - Cast/location/props/costume/decor/tests are approved or flagged for owner decision
    success_criteria:
      - Schema-valid scene_plan
  - name: assets
    skill: pipelines/zavod/asset-director
    required_artifacts_in: [scene_plan]
    produces: [asset_manifest]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Real-subject edits are image-to-image with the real photo attached (higgsfield-capabilities.md)
      - On-image text is overlay, not AI-baked
    sub_stages:
      - name: source_media_and_rights_lock
        produces: [rights_lock]
        description: Confirm every source image, location, likeness, music, and rights-sensitive asset before creation.
        human_approval_default: true
        review_focus:
          - No face/location/music/right is assumed
      - name: prompt_pack_or_shoot_pack_approval
        produces: [prompt_pack]
        description: Present the exact render/shoot prompts, negative prompts, model/tool route, params, cost estimate, and source attachments before any generation or shooting.
        human_approval_default: true
        review_focus:
          - Owner approves each prompt or shoot setup
      - name: asset_generation_or_shoot
        produces: [generated_assets]
        description: Create only the approved assets or shoot only the approved setups, then run first-pass QC.
        human_approval_default: true
        review_focus:
          - Output matches approved prompt/shot card
          - Continuity and source geometry hold
    success_criteria:
      - Schema-valid asset_manifest
  - name: edit
    skill: pipelines/zavod/edit-director
    required_artifacts_in: [scene_plan, asset_manifest]
    produces: [edit_decisions]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Hook in first 2-3s; pacing per playbook (post-production.md)
    sub_stages:
      - name: story_cut
        produces: [story_cut]
        description: Assemble the story structure first; confirm the cut still tells the approved story.
        human_approval_default: true
        review_focus:
          - Story order and hook placement work
      - name: rhythm_pass
        produces: [rhythm]
        description: Shape pacing, pauses, transitions, and montage grammar.
        human_approval_default: true
        review_focus:
          - Rhythm supports the emotion
      - name: sound_music_color_vfx_plan
        produces: [post_plan]
        description: Plan sound cleanup/design, music placement, color direction, and needed VFX before final compose.
        human_approval_default: true
        review_focus:
          - Sound, music, color, and VFX decisions are explicit
    success_criteria:
      - Schema-valid edit_decisions
  - name: compose
    skill: pipelines/zavod/compose-director
    required_artifacts_in: [edit_decisions, asset_manifest]
    produces: [render_report, final_review]
    required_tools: [video_compose]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "GATE: continuity_checker passes on every generated clip (object-permanence)"
      - "REVIEW: delivery_promise honored (motion-led not silently downgraded)"
      - Audio mix / loudness per playbook; ffprobe validates output
    sub_stages:
      - name: final_mix
        produces: [final_mix]
        description: Clean and shape dialogue/VO, ambience, SFX, and music into a finished mix.
        human_approval_default: true
        review_focus:
          - Loudness, intelligibility, and sync pass
      - name: color_vfx_master_qc
        produces: [master_qc]
        description: Apply color, VFX if needed, subtitles/captions, technical QC, and final versions.
        human_approval_default: true
        review_focus:
          - Picture, sound, subtitles, grade, and deliverable specs pass
    success_criteria:
      - Schema-valid render_report; output passes ffprobe
  - name: publish
    skill: pipelines/zavod/publish-director
    required_artifacts_in: [render_report, final_review]
    produces: [publish_log]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Caption/hashtags per playbook.md; AI-content label per platform
    sub_stages:
      - name: presentation_route
        produces: [presentation_route]
        description: Decide festival/theatrical/online/private/social route, caption package, schedule, and first-hour growth plan.
        human_approval_default: true
        review_focus:
          - Release route and public communication are approved
    success_criteria:
      - Schema-valid publish_log
