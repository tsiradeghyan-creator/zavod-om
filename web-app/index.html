<!doctype html>
<html lang="hy">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ef" />
    <meta name="description" content="ZAVOD — սցենարից նկարահանման պատրաստ արտադրական փաթեթ։" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-family='Arial' font-size='44' font-weight='900' fill='%23f04b23'%3EZ%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>ZAVOD — Script to Set</title>
  </head>
  <body>
    <header class="app-header">
      <button class="wordmark" type="button" data-home aria-label="ZAVOD">
        <span>Z</span><b>ZAVOD</b><small>SCRIPT → SET</small>
      </button>
      <div class="project-crumb" data-project-crumb></div>
      <div class="header-actions">
        <div class="language-switch" aria-label="Language">
          <button type="button" data-lang="hy" class="is-active">ՀԱՅ</button>
          <button type="button" data-lang="ru">РУС</button>
          <button type="button" data-lang="en">ENG</button>
        </div>
        <button class="header-button is-hidden" type="button" data-new-project></button>
        <button class="header-button dark is-hidden" type="button" data-export-project></button>
      </div>
    </header>

    <main data-app></main>

    <dialog class="help-dialog" data-help-dialog>
      <div class="help-shell">
        <header><span data-i18n="helpTitle"></span><button type="button" data-close-help aria-label="Close">×</button></header>
        <div data-help-content></div>
      </div>
    </dialog>

    <div class="toast" data-toast role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
