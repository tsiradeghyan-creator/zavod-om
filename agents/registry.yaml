version: "1.0"

policy:
  coordinator: executive-producer
  verifier: quality-auditor
  max_parallel: 4
  max_agents: 9
  max_depth: 3
  max_retries: 0
  max_wall_time_seconds: 3600
  route_score_floor: 2.0
  require_independent_verifier: true
  preserve_dissent: true

agents:
  - id: executive-producer
    name: Executive Producer
    kind: coordinator
    description: Decomposes the request, selects the smallest sufficient specialist team, protects owner decisions, and synthesizes evidence without hiding dissent.
    capabilities:
      - request_decomposition
      - pipeline_routing
      - task_synthesis
      - owner_gate_management
    execution_order: 0
    priority: 100
    parallel_safe: false
    always_selected: true
    activation_mode: always
    trigger:
      intents_any: []
      topics_any: []
      formats_any: []
      languages_any: []
      risks_any: []
      capabilities_any: []
      keywords_any: []
      keywords_none: []
    skills:
      - skills/pipelines/zavod/executive-producer.md
      - skills/zavod-craft/production-manager-orchestrator.md
      - skills/zavod-craft/production-protocol.md
    input_artifacts: []
    output_artifact: orchestration_decision
    allowed_tools:
      - artifact_read
      - agent_dispatch
      - checkpoint_read
    evidence_required:
      - selected and rejected agents with reasons
      - preserved blocking and minority opinions
    stop_conditions:
      - stop before every owner-gated action
      - stop when a mandatory specialist fails closed
    external_side_effects: forbidden
    failure_policy: fail_closed
    fallback_agent: null
    budget: {max_turns: 12, max_seconds: 900}
    prompt_version: "1.0"
    positive_examples:
      - Ստեղծիր ամբողջական արշավ՝ գաղափարից մինչև հրապարակման փաթեթ
      - Improve the agent system and prove the result
    negative_examples:
      - Ուղղիր միայն այս մեկ տառասխալը
    platform:
      claude_agent_file: .claude/agents/zavod-executive-producer.md

  - id: research-accuracy
    name: Research and Accuracy Director
    kind: specialist
    description: Finds current primary evidence, separates fact from inference, checks claims, and refuses unsupported certainty.
    capabilities:
      - current_research
      - factual_accuracy
      - source_provenance
      - competitive_benchmark
    execution_order: 10
    priority: 90
    parallel_safe: true
    always_selected: false
    activation_mode: automatic
    trigger:
      intents_any: [research, audit]
      topics_any: [research, trends, facts, benchmark, competition]
      formats_any: [article, documentary, animated_explainer]
      languages_any: []
      risks_any: [factual_claims]
      capabilities_any: [current_research, factual_accuracy, source_provenance, competitive_benchmark]
      keywords_any:
        - հետազոտ
        - աղբյուր
        - փաստ
        - վերջին
        - աշխարհում լավագույն
        - աշխարհում ամենալավ
        - հավասարը չունեն
        - ամենալավը
        - լավագույններից լավագույն
        - համեմատ
        - research
        - benchmark
        - latest
        - source
      keywords_none: []
    skills:
      - skills/zavod-craft/research-accuracy-consultant.md
      - skills/zavod-craft/world-benchmark.md
    input_artifacts: [brief, content_spec]
    output_artifact: research_packet
    allowed_tools: [web_search, source_read, artifact_read]
    evidence_required:
      - direct primary-source links for unstable claims
      - explicit inference labels
      - claim-to-source mapping
    stop_conditions:
      - stop if a high-impact claim cannot be verified
      - never invent a citation
    external_side_effects: forbidden
    failure_policy: fail_closed
    fallback_agent: null
    budget: {max_turns: 16, max_seconds: 1200}
    prompt_version: "1.0"
    positive_examples:
      - Գտիր այս թեմայի վերջին փաստերը և աղբյուրները
      - Compare our orchestration with current official agent frameworks
    negative_examples:
      - Վերաշարադրիր տրված նախադասությունը՝ առանց նոր փաստերի
    platform:
